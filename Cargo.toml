[workspace]
members = [
    "crates/flower-component",
    "crates/flower-component-tools",
    "crates/flower-engine",
    "crates/flower-engine-tests",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
wit-bindgen = "0.47"
sha2 = "0.10"
wasmparser = "0.240"
wit-component = "0.240"
