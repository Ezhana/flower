[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
yaml_serde = "0.10"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
wit-bindgen = "0.47"
